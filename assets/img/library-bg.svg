<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shelfGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Library shelves -->
  <g opacity="0.8">
    <!-- Top shelf -->
    <rect x="200" y="200" width="1520" height="40" fill="url(#shelfGradient)" rx="5"/>
    <rect x="200" y="240" width="1520" height="200" fill="#8b4513" opacity="0.3"/>
    
    <!-- Books on top shelf -->
    <rect x="220" y="250" width="30" height="180" fill="url(#bookGradient1)" rx="2"/>
    <rect x="255" y="250" width="25" height="180" fill="url(#bookGradient2)" rx="2"/>
    <rect x="285" y="250" width="35" height="180" fill="url(#bookGradient3)" rx="2"/>
    <rect x="325" y="250" width="28" height="180" fill="url(#bookGradient1)" rx="2"/>
    <rect x="358" y="250" width="32" height="180" fill="url(#bookGradient2)" rx="2"/>
    
    <!-- More books -->
    <rect x="500" y="250" width="30" height="180" fill="url(#bookGradient3)" rx="2"/>
    <rect x="535" y="250" width="25" height="180" fill="url(#bookGradient1)" rx="2"/>
    <rect x="565" y="250" width="35" height="180" fill="url(#bookGradient2)" rx="2"/>
    <rect x="605" y="250" width="28" height="180" fill="url(#bookGradient3)" rx="2"/>
    
    <!-- Middle shelf -->
    <rect x="200" y="500" width="1520" height="40" fill="url(#shelfGradient)" rx="5"/>
    <rect x="200" y="540" width="1520" height="200" fill="#8b4513" opacity="0.3"/>
    
    <!-- Books on middle shelf -->
    <rect x="220" y="550" width="30" height="180" fill="url(#bookGradient2)" rx="2"/>
    <rect x="255" y="550" width="25" height="180" fill="url(#bookGradient3)" rx="2"/>
    <rect x="285" y="550" width="35" height="180" fill="url(#bookGradient1)" rx="2"/>
    <rect x="325" y="550" width="28" height="180" fill="url(#bookGradient2)" rx="2"/>
    
    <!-- Bottom shelf -->
    <rect x="200" y="800" width="1520" height="40" fill="url(#shelfGradient)" rx="5"/>
    <rect x="200" y="840" width="1520" height="200" fill="#8b4513" opacity="0.3"/>
    
    <!-- Books on bottom shelf -->
    <rect x="220" y="850" width="30" height="180" fill="url(#bookGradient1)" rx="2"/>
    <rect x="255" y="850" width="25" height="180" fill="url(#bookGradient3)" rx="2"/>
    <rect x="285" y="850" width="35" height="180" fill="url(#bookGradient2)" rx="2"/>
  </g>
  
  <!-- Floating elements for depth -->
  <g opacity="0.1">
    <circle cx="300" cy="150" r="50" fill="white"/>
    <circle cx="1600" cy="300" r="80" fill="white"/>
    <circle cx="1400" cy="900" r="60" fill="white"/>
  </g>
  
  <!-- Light rays -->
  <g opacity="0.2">
    <polygon points="0,0 400,0 200,400" fill="white"/>
    <polygon points="1920,0 1520,0 1720,400" fill="white"/>
  </g>
</svg>